name: validate-export

# PR 검증 전용: data/·scripts/ 변경 PR에서 v0.1·v0.2 export 컨트랙트 검사.
# 브랜치 보호의 required status check 로 사용 가능.
# main push 시 배포 게이트(라이브=v0.1)는 deploy.yml 의 validate job 이 담당.
on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate v0.1 export
        run: python3 scripts/validate_medistack_v0_1_export.py data/medistack_v0.1_beta_export.json
      - name: Validate v0.2 export
        run: python3 scripts/validate_medistack_v0_2_export.py data/medistack_v0.2_beta_export.json
      - name: Validate v0.3 operational aliases (search-only, app-unwired)
        run: python3 scripts/validate_medistack_v0_3_aliases.py data/medistack_v0.3_aliases.json data/medistack_v0.2_beta_export.json
      - name: Validate alias surface forms (v0.9 newline/whitespace hygiene)
        run: python3 scripts/validate_alias_surface_forms.py data/medistack_v0.3_aliases.json
